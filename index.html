<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #fff;
        }

        header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #222;
        }

        .intro {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .tools-list {
            list-style: disc;
            padding-left: 1.5rem;
        }

        .tools-list li {
            margin-bottom: 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        .tools-list a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }

        .tools-list a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.9rem;
        }

        footer a {
            color: #0066cc;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tools</h1>
        <p class="intro">
            Miscellaneous HTML+JavaScript tools built mostly with the help of LLMs. 
            See also <a href="python/">python/</a> for python scripts.
        </p>
        <p class="intro">
            Inspired by <a href="https://tools.simonwillison.net/" target="_blank">tools.simonwillison.net</a>
        </p>
    </header>

    <main>
        <ul class="tools-list">
            <li>
                <a href="argument-graph/">Argument Graph Visualizer</a> visualize argument graphs with claims, evidence, and logical relationships
            </li>
        </ul>
    </main>
</body>
</html>
