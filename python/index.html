<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #fff;
        }

        header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #222;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #0066cc;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .intro {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .tools-list {
            list-style: none;
        }

        .tools-list li {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #0066cc;
            transition: background-color 0.2s ease;
        }

        .tools-list li:hover {
            background-color: #f0f0f0;
        }

        .tools-list a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.2rem;
        }

        .tools-list a:hover {
            text-decoration: underline;
        }

        .tool-description {
            margin-top: 0.5rem;
            color: #666;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="../" class="back-link">← Back to all tools</a>
        <h1>Python Tools</h1>
        <p class="intro">
            Python-based tools and utilities.
        </p>
    </header>

    <main>
        <ul class="tools-list">
            <!-- Python tools will be added here as they're created -->
        </ul>
    </main>
</body>
</html>
